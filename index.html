<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ভালো আছেন?</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f4f7fb;
      color: #182230;
      font-family: system-ui, "Noto Sans Bengali", sans-serif;
    }
    main {
      padding: 48px 32px;
      text-align: center;
      background: white;
      border-radius: 20px;
      box-shadow: 0 12px 36px rgba(0,0,0,.08);
      width: min(90%, 520px);
    }
    h1 { margin: 0; font-size: clamp(2rem, 8vw, 3.5rem); }
    p { margin: 16px 0 0; color: #667085; font-size: 1.1rem; }
  </style>
</head>
<body>
  <main>
    <h1>ভালো আছেন?</h1>
    <p>আশা করি ভালো আছেন।</p>
  </main>
</body>
</html>
